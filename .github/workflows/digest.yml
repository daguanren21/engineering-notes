name: Daily digest

# 00:00 UTC is 08:00 in Asia/Shanghai.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List the candidates without calling the model
        type: boolean
        default: false
      draft:
        description: Write the article with draft true, so it stays off the site
        type: boolean
        default: false
      limit:
        description: How many articles to write in this run
        type: string
        default: "1"

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for a model API key
        id: guard
        env:
          KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::DEEPSEEK_API_KEY is not set. Add it under Settings > Secrets and variables > Actions, then re-run this job."
          fi

      - name: Collect and write
        id: digest
        if: steps.guard.outputs.skip != 'true'
        run: |
          node scripts/ingest/run.ts \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.draft && '--draft' || '' }} \
            ${{ inputs.limit && format('--limit={0}', inputs.limit) || '' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DIGEST_BRIDGE_TEMPLATE: ${{ vars.DIGEST_BRIDGE_TEMPLATE }}

      # A malformed article must never reach main, so the whole site is rebuilt
      # before anything is committed.
      - name: Verify the site still builds
        if: steps.digest.outputs.created == 'true'
        run: pnpm build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io

      - name: Commit the new article
        if: steps.digest.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/articles scripts/ingest/state.json
          if git diff --cached --quiet; then
            echo "nothing staged"
            exit 0
          fi
          git commit -m "content: daily digest $(date -u +%Y-%m-%d)"
          git push
